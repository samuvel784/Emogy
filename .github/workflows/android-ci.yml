# Optional continuous integration: runs the unit tests and lint on every push and pull request.
# NOTE: this workflow was written but NOT executed by the author of this template. If a run fails
# on GitHub, open the run log, fix the cause and adjust the Java version below.
name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Lint (debug)
        run: ./gradlew :app:lintDebug --stacktrace
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests
            app/build/reports/lint-results-debug.html
